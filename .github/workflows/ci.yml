# Build, format check, all tests (Testcontainers Postgres), vulnerable package scan and Bicep compile.
# Runs on PRs to stage, main and the gamecore integration branch, and is reused by the release workflow.
name: CI

on:
  pull_request:
    branches: [stage, main, gamecore]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Govern.slnx

      - name: Build (warnings are errors)
        run: dotnet build Govern.slnx --configuration Release --no-restore

      - name: Format check
        run: dotnet format Govern.slnx --verify-no-changes --no-restore

      - name: Test (architecture, unit, integration)
        run: dotnet test Govern.slnx --configuration Release --no-build --coverage --coverage-output-format cobertura

      - name: Vulnerable packages
        run: |
          dotnet list Govern.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      # Same client configuration as release.yml, with a dummy origin: catches new inline scripts or lost placeholders on the PR.
      - name: Client release configuration (dry run)
        run: |
          dotnet publish src/Govern.Client --configuration Release --output "$RUNNER_TEMP/client-publish"
          .github/scripts/configure-client.sh "$RUNNER_TEMP/client-publish/wwwroot" https://api.example.com

      - name: Compile Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: TestResults/**/*.cobertura.xml
          if-no-files-found: ignore
          retention-days: 14
